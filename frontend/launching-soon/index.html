<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CopyGen — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c9a84c;
    --gold-bright: #f0d080;
    --gold-dim: #7a6030;
    --bg: #050505;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    color: #fff;
  }

  canvas#bg {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  .scene {
    position: fixed; inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .orb-wrap {
    position: relative;
    width: 180px; height: 180px;
    margin-bottom: 36px;
    animation: orbFloat 4s ease-in-out infinite;
  }
  .orb {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%,
      #fff5d0 0%, var(--gold-bright) 20%,
      var(--gold) 50%, #3a2800 80%, #000 100%);
    box-shadow:
      0 0 60px 20px rgba(201,168,76,0.5),
      0 0 120px 40px rgba(201,168,76,0.25),
      inset 0 -20px 40px rgba(0,0,0,0.6);
    animation: orbPulse 3s ease-in-out infinite alternate;
  }
  .orb-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.3);
    animation: ringExpand 3s ease-out infinite;
  }
  .orb-ring:nth-child(2) { inset: -20px; animation-delay: 0s; }
  .orb-ring:nth-child(3) { inset: -45px; animation-delay: 0.8s; }
  .orb-ring:nth-child(4) { inset: -75px; animation-delay: 1.6s; }

  @keyframes orbFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-16px); }
  }
  @keyframes orbPulse {
    from { box-shadow: 0 0 60px 20px rgba(201,168,76,0.5), 0 0 120px 40px rgba(201,168,76,0.25); }
    to   { box-shadow: 0 0 80px 30px rgba(201,168,76,0.7), 0 0 160px 60px rgba(201,168,76,0.35); }
  }
  @keyframes ringExpand {
    0%   { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.5em;
    color: rgba(201,168,76,0.5);
    text-transform: uppercase;
    margin-bottom: 10px;
    animation: fadeUp 1.6s 0.2s ease both;
  }

  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(72px, 12vw, 140px);
    letter-spacing: 0.12em;
    line-height: 1;
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 50%, var(--gold-dim) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(201,168,76,0.6));
    animation: brandReveal 1.4s cubic-bezier(0.16,1,0.3,1) both;
  }

  .tagline {
    font-size: clamp(11px, 1.5vw, 14px);
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin-top: 12px;
    animation: fadeUp 1.8s 0.5s ease both;
    text-align: center;
    max-width: 480px;
    line-height: 2;
  }

  .divider {
    width: 180px; height: 1px;
    margin: 28px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: fadeUp 1.8s 0.6s ease both;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
  }
  .divider::before { left: 0; }
  .divider::after  { right: 0; }

  .countdown {
    display: flex;
    gap: 28px;
    animation: fadeUp 1.8s 0.8s ease both;
  }
  .cd-block { text-align: center; }
  .cd-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(38px, 6vw, 64px);
    color: var(--gold-bright);
    line-height: 1;
    text-shadow: 0 0 20px rgba(201,168,76,0.6);
  }
  .cd-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .cd-sep {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(38px, 6vw, 64px);
    color: var(--gold-dim);
    align-self: flex-start;
    padding-top: 2px;
  }

  .domain {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.35em;
    color: rgba(201,168,76,0.3);
    text-transform: uppercase;
    z-index: 2;
    animation: fadeUp 2s 1s ease both;
    white-space: nowrap;
  }

  .scanlines {
    position: fixed; inset: 0;
    z-index: 3;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
  }

  @keyframes brandReveal {
    from { opacity: 0; transform: translateY(40px) scale(0.9); filter: blur(20px) drop-shadow(0 0 0px rgba(201,168,76,0)); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="scanlines"></div>

<div class="scene">
  <div class="orb-wrap">
    <div class="orb"></div>
    <div class="orb-ring"></div>
    <div class="orb-ring"></div>
    <div class="orb-ring"></div>
  </div>

  <div class="eyebrow">Built for Marketing Agencies</div>
  <div class="brand">CopyGen</div>
  <div class="tagline">Scale your agency's output.<br>Never hire a junior copywriter again.</div>

  <div class="divider"></div>

  <div class="countdown">
    <div class="cd-block"><div class="cd-num" id="cd-d">00</div><div class="cd-label">Days</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-block"><div class="cd-num" id="cd-h">00</div><div class="cd-label">Hours</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-block"><div class="cd-num" id="cd-m">00</div><div class="cd-label">Mins</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-block"><div class="cd-num" id="cd-s">00</div><div class="cd-label">Secs</div></div>
  </div>
</div>

<div class="domain">copygen.in &nbsp;·&nbsp; Launching Soon</div>

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const GOLD = 'rgba(201,168,76,';
const particles = [];
for (let i = 0; i < 180; i++) {
  particles.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.5 + 0.3,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    alpha: Math.random() * 0.6 + 0.1,
    pulse: Math.random() * Math.PI * 2,
    pulseSpeed: 0.01 + Math.random() * 0.02,
  });
}

function drawGrid() {
  const W = canvas.width, H = canvas.height;
  const horizon = H * 0.62;
  const numV = 14, numH = 12;
  const spread = W * 1.4;
  ctx.save();
  ctx.strokeStyle = GOLD + '1)';
  ctx.lineWidth = 0.6;
  for (let i = 0; i <= numV; i++) {
    const bx = (i / numV) * spread - spread / 2 + W / 2;
    ctx.globalAlpha = 0.13;
    ctx.beginPath();
    ctx.moveTo(W / 2, horizon);
    ctx.lineTo(bx, H);
    ctx.stroke();
  }
  for (let j = 0; j <= numH; j++) {
    const progress = j / numH;
    const eased = Math.pow(progress, 2);
    const y = horizon + eased * (H - horizon);
    const halfW = (spread / 2) * progress;
    ctx.globalAlpha = 0.06 + eased * 0.12;
    ctx.beginPath();
    ctx.moveTo(W / 2 - halfW, y);
    ctx.lineTo(W / 2 + halfW, y);
    ctx.stroke();
  }
  ctx.restore();
}

let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

function animate() {
  requestAnimationFrame(animate);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width * 0.75);
  grad.addColorStop(0, 'rgba(20,12,0,1)');
  grad.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawGrid();

  const mg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 250);
  mg.addColorStop(0, 'rgba(201,168,76,0.06)');
  mg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = mg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cg = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, 400);
  cg.addColorStop(0, 'rgba(201,168,76,0.07)');
  cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.pulse += p.pulseSpeed;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
    const a = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
    for (let j = i + 1; j < particles.length; j++) {
      const q = particles[j];
      const dx = p.x - q.x, dy = p.y - q.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 90) {
        ctx.beginPath();
        ctx.strokeStyle = GOLD + (0.12 * (1 - dist / 90)) + ')';
        ctx.lineWidth = 0.4;
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(q.x, q.y);
        ctx.stroke();
      }
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = GOLD + a + ')';
    ctx.fill();
  }
}
animate();

// 72 hours countdown from deployment time
const launch = new Date('2026-04-25T15:13:00Z');
function updateCountdown() {
  const diff = Math.max(0, launch - new Date());
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('cd-d').textContent = String(d).padStart(2,'0');
  document.getElementById('cd-h').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(m).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(s).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
